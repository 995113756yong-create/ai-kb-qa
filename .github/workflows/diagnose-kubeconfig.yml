name: Diagnose Kubeconfig

# 手动触发，只做诊断，不部署
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect secret shape
        env:
          KC: ${{ secrets.SEALOS_KUBECONFIG }}
        run: |
          if [ -z "$KC" ]; then
            echo "::error::SEALOS_KUBECONFIG 为空或不存在"
            exit 1
          fi

          echo "长度: ${#KC}"
          echo "行数: $(printf '%s' "$KC" | wc -l)"

          case "$KC" in
            apiVersion:*|*"kind: Config"*)
              echo "形式: YAML"
              printf '%s\n' "$KC" > kc.yaml
              ;;
            *)
              echo "形式: 非 YAML，尝试 base64"
              if printf '%s' "$KC" | base64 -d > kc.yaml 2>/dev/null; then
                echo "base64 解码: 成功"
              else
                echo "::error::既不是 YAML 也不是合法 base64"
                exit 1
              fi
              ;;
          esac

          echo "--- 关键字段自检（只看是否存在，不打印值）---"
          for k in "server:" "certificate-authority-data:" "token:" "current-context:"; do
            if grep -q "$k" kc.yaml; then
              echo "  $k 存在"
            else
              echo "  ::warning::$k 缺失"
            fi
          done

          echo "--- CA 数据长度 ---"
          grep "certificate-authority-data:" kc.yaml | sed 's/.*data: //' | tr -d ' ' | awk '{print length($0)}'

      - name: Try kubectl
        run: |
          mkdir -p "$HOME/.kube"
          cp kc.yaml "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          curl -sLO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          echo "--- kubectl cluster-info ---"
          if kubectl cluster-info 2>&1; then
            echo "::notice::集群连通正常"
          else
            echo "::error::kubectl 连不上集群（见上方错误）"
            exit 1
          fi

      - name: List deployments in both namespaces
        run: |
          for ns in ns-dcnh2ec4 ns-p93832nn; do
            echo "--- $ns ---"
            kubectl get deployment -n "$ns" -o wide 2>&1 || true
          done
