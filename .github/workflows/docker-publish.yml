name: Build, Push and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ---------- 后端测试 ----------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  # ---------- 前端测试 ----------
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 要求 node ^22.22.2，写死到 22.x 最新补丁版
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------- 构建并推送两个镜像 ----------
  build-and-push:
    needs: [backend-test, frontend-test]
    # PR 只跑测试，不推镜像
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 后端沿用 ai-kb-qa 这个名字，Sealos 上已有的部署直接变成 API 服务
          - image: ai-kb-qa
            context: ./backend
          - image: ai-kb-qa-web
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  # ---------- 部署 ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl with Sealos kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.SEALOS_KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Sealos 的 App Launchpad 会给 deployment 加随机后缀（如 ai-kb-qa-zmtnddmomzjs），
      # 所以不能写死名字：先按前缀找，找到唯一的就直接用，找不到就跳过而不是失败。
      - name: Restart deployments
        env:
          # 两个都在仓库 Settings → Variables 里配；namespace 必须改对，
          # 前后端当前不在同一个 namespace
          API_NAMESPACE: ${{ vars.SEALOS_NAMESPACE_API }}
          WEB_NAMESPACE: ${{ vars.SEALOS_NAMESPACE_WEB }}
          API_PREFIX: ${{ vars.SEALOS_APP_API || 'ai-kb-qa' }}
          WEB_PREFIX: ${{ vars.SEALOS_APP_WEB || 'ai-kb-qa-web' }}
        run: |
          set -eu

          restart_one() {
            ns="$1"; prefix="$2"; label="$3"

            if [ -z "$ns" ]; then
              echo "[$label] 未配置 namespace，跳过"
              return 0
            fi

            # 前缀匹配可能同时命中 ai-kb-qa 和 ai-kb-qa-web，用完整名字优先
            name=$(kubectl get deployment -n "$ns" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
              | grep -E "^${prefix}(-[a-z0-9]+)?$" | head -n 1 || true)

            if [ -z "$name" ]; then
              echo "[$label] 在 $ns 下没找到前缀为 $prefix 的 deployment，跳过"
              return 0
            fi

            echo "[$label] 重启 deployment/$name (namespace=$ns)"
            kubectl rollout restart "deployment/$name" -n "$ns"
            kubectl rollout status "deployment/$name" -n "$ns" --timeout=180s
          }

          restart_one "$API_NAMESPACE" "$API_PREFIX" "api"
          restart_one "$WEB_NAMESPACE" "$WEB_PREFIX" "web"
