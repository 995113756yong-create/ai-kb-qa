name: Build, Push and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ---------- 后端测试 ----------
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  # ---------- 前端测试 ----------
  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 要求 node ^22.22.2，写死到 22.x 最新补丁版
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------- 构建并推送两个镜像 ----------
  build-and-push:
    needs: [backend-test, frontend-test]
    # PR 只跑测试，不推镜像
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 后端沿用 ai-kb-qa 这个名字，Sealos 上已有的部署直接变成 API 服务
          - image: ai-kb-qa
            context: ./backend
          - image: ai-kb-qa-web
            context: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  # ---------- 部署 ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubectl with Sealos kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.SEALOS_KUBECONFIG }}
        run: |
          set -eu
          mkdir -p "$HOME/.kube"

          # 两种形式都支持：
          #   1) 直接贴 YAML（多行，Secret 输入框可能压掉换行）
          #   2) 贴 base64（单行，不会被换行破坏，推荐）
          case "$KUBECONFIG_CONTENT" in
            apiVersion:*|*"kind: Config"*)
              printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
              ;;
            *)
              if ! printf '%s' "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config" 2>/dev/null; then
                echo "::error::SEALOS_KUBECONFIG 既不是 YAML 也不是合法 base64"
                exit 1
              fi
              ;;
          esac
          chmod 600 "$HOME/.kube/config"

          # 结构自检：缺了这几行 kubectl 一定连不上，早点报清楚
          for key in "server:" "certificate-authority-data:|insecure-skip-tls-verify:" "token:|client-certificate:"; do
            if ! grep -Eq "$key" "$HOME/.kube/config"; then
              echo "::error::kubeconfig 缺少 ${key%%|*} 字段，Secret 内容可能被截断"
              exit 1
            fi
          done

      # 关键：先证明能连上集群，否则后面所有 kubectl 查询都会返回空，
      # 被误当成"应用不存在"而静默跳过，造成部署成功但实际没部署的假象。
      - name: Verify cluster connectivity
        run: |
          set -eu
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "::error::无法连接 Sealos 集群，请检查 SEALOS_KUBECONFIG（证书或 token 可能已失效）"
            kubectl cluster-info || true
            exit 1
          fi
          echo "集群连通性正常"
          kubectl version --output=yaml 2>/dev/null | head -n 5 || true

      # Sealos 的 App Launchpad 会给 deployment 加随机后缀（如 ai-kb-qa-zmtnddmomzjs），
      # 所以不能写死名字：先按前缀找，找到唯一的就直接用，找不到就跳过而不是失败。
      - name: Restart deployments
        env:
          # 两个都在仓库 Settings → Variables 里配；namespace 必须改对，
          # 前后端当前不在同一个 namespace
          API_NAMESPACE: ${{ vars.SEALOS_NAMESPACE_API }}
          WEB_NAMESPACE: ${{ vars.SEALOS_NAMESPACE_WEB }}
          API_PREFIX: ${{ vars.SEALOS_APP_API || 'ai-kb-qa' }}
          WEB_PREFIX: ${{ vars.SEALOS_APP_WEB || 'ai-kb-qa-web' }}
        run: |
          set -eu

          restart_one() {
            ns="$1"; prefix="$2"; label="$3"

            if [ -z "$ns" ]; then
              echo "[$label] 未配置 namespace，跳过"
              return 0
            fi

            # 查询本身失败要区分于「查不到」：连不上集群时不能静默跳过
            if ! list=$(kubectl get deployment -n "$ns" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>&1); then
              echo "::error::[$label] 查询 namespace $ns 失败：$list"
              return 1
            fi

            # 前缀匹配可能同时命中 ai-kb-qa 和 ai-kb-qa-web，用完整名字优先
            name=$(printf '%s\n' "$list" | grep -E "^${prefix}(-[a-z0-9]+)?$" | head -n 1 || true)

            if [ -z "$name" ]; then
              echo "[$label] 在 $ns 下没找到前缀为 $prefix 的 deployment，跳过"
              return 0
            fi

            echo "[$label] 重启 deployment/$name (namespace=$ns)"
            kubectl rollout restart "deployment/$name" -n "$ns"
            kubectl rollout status "deployment/$name" -n "$ns" --timeout=180s
          }

          failed=0
          restart_one "$API_NAMESPACE" "$API_PREFIX" "api" || failed=1
          restart_one "$WEB_NAMESPACE" "$WEB_PREFIX" "web" || failed=1
          exit "$failed"
