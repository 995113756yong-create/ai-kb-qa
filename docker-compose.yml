services:
  api:
    build: ./backend
    env_file: [backend/.env]
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/faiss_index:/app/backend/faiss_index
      - ./backend/logs:/app/backend/logs
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped
